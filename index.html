<style>
/* ===== 主题变量 ===== */
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --primary:#2563eb; --secondary:#06b6d4; --border:#e5e7eb;
  --pos:#e23c3c; --neg:#1f9d55; --shadow:0 6px 20px rgba(20,40,80,.08);
  --accent-soft:rgba(37,99,235,.12);
  --title-blue:#1e40af; /* 卡片标题深蓝（用户指定） */
  /* ===== 字号令牌：美化提速•单一来源 =====
     方阵卡片：标题(--fs-matrix-title) : 其余(--fs-matrix-body) = 20:15
     明细卡片：标题/表头/正文三档；改令牌即全局生效，无需满文件找字号。 */
  --fs-matrix-title:20px;
  --fs-matrix-body:15px;
  --fs-card-title:13px;
  --fs-card-head:11px;
  --fs-card-body:11.5px;
}
body.theme-tech{--bg:#eef2fb;--card:#ffffff;--text:#16243b;--muted:#5b6b86;--primary:#2563eb;--secondary:#06b6d4;--border:#dbe4f3;--pos:#e23c3c;--neg:#1f9d55;--accent-soft:rgba(37,99,235,.12);}
body.theme-redgold{--bg:#fbf6f0;--card:#ffffff;--text:#3a2a1c;--muted:#8a6f57;--primary:#c0392b;--secondary:#d4af37;--border:#f0dcc8;--pos:#c0392b;--neg:#1f9d55;--accent-soft:rgba(192,57,43,.10);}
body.theme-green{--bg:#f1faf5;--card:#ffffff;--text:#173a2c;--muted:#5f7d6c;--primary:#059669;--secondary:#10b981;--border:#d4ecdf;--pos:#e23c3c;--neg:#1f9d55;--accent-soft:rgba(5,150,105,.12);}
body.theme-dark{--bg:#0b1220;--card:#15203a;--text:#e6edf7;--muted:#93a4c0;--primary:#38bdf8;--secondary:#a78bfa;--border:#243352;--pos:#fb7185;--neg:#34d399;--accent-soft:rgba(56,189,248,.16);--shadow:0 8px 28px rgba(0,0,0,.45);--title-blue:#82a9ff;}
body.theme-gray{--bg:#f5f6f8;--card:#ffffff;--text:#2b2f36;--muted:#7c828c;--primary:#475569;--secondary:#94a3b8;--border:#e6e8ec;--pos:#e23c3c;--neg:#1f9d55;--accent-soft:rgba(71,85,105,.10);}
body.theme-antgold{--bg:#141414;--card:#1f1f1f;--text:rgba(255,255,255,.88);--muted:rgba(255,255,255,.50);--primary:#faad14;--secondary:#ffc53d;--border:#434343;--pos:#ff4d4f;--neg:#52c41a;--accent-soft:rgba(250,173,20,.14);--shadow:0 8px 28px rgba(0,0,0,.55);--title-blue:#faad14;}
body.theme-antgold .tab-btn.active,body.theme-antgold .mode-btn.active{color:#141414;}

*{box-sizing:border-box;}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text);transition:background .35s,color .35s;padding:0 0 40px;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:16px 28px;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
.title-wrap h1{margin:0;font-size:22px;letter-spacing:.5px;}
.title-wrap p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.theme-switch{display:flex;gap:8px;flex-wrap:wrap;}
.theme-btn{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;border-radius:999px;font-size:13px;transition:.2s;display:flex;align-items:center;gap:6px;}
.theme-btn:hover{transform:translateY(-1px);}
.theme-btn .dot{width:10px;height:10px;border-radius:50%;}
.theme-btn.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--accent-soft);font-weight:600;}
.print-btn{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;border-radius:999px;font-size:13px;}
.print-btn:hover{border-color:var(--primary);}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px;}

.section-title{font-size:16px;font-weight:800;margin:28px 0 6px;display:flex;align-items:center;gap:9px;}
.section-title::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--primary);}
.section-desc{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.7;}

/* ===== 系统指标 ===== */
.sys-cat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px 18px;box-shadow:var(--shadow);margin-bottom:16px;}
.sys-cat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
.sys-cat-title{font-size:15px;font-weight:800;}
.sys-cat-count{font-size:12px;color:var(--muted);background:var(--accent-soft);padding:3px 10px;border-radius:999px;font-weight:600;}
/* ===== 字号规则（本轮优化•5:3）=====
   标题 .ib-name … 深蓝(var(--title-blue))、25px、800、居中
   其余所有文字（列头/行标签/数值/同比/标签/徽标）统一 15px，靠颜色（主色/红涨绿跌）区分信号，避免眼花缭乱。
   标题:其余 = 25:15 = 5:3。 */
.sys-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.ind-box{position:relative;background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:14px 15px 13px;overflow:hidden;transition:.2s;}
.ind-box:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--primary);}
.ib-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px;}
.ib-name{font-size:var(--fs-card-title);font-weight:700;line-height:1.3;color:var(--title-blue);}
.ib-tag{font-size:var(--fs-matrix-body);padding:3px 10px;border-radius:6px;font-weight:600;white-space:nowrap;}
.ib-tag.count{background:var(--accent-soft);color:var(--primary);}
.ib-tag.ratio{background:rgba(217,119,6,.14);color:#b45309;}
.ib-tag.cum{background:rgba(31,157,85,.14);color:#1f9d55;}
.ib-vals{display:flex;gap:12px;align-items:flex-end;}
.ib-val{flex:1;}
.ib-vlabel{display:block;font-size:18px;color:var(--muted);margin-bottom:2px;}
.ib-vnum{font-size:18px;font-weight:700;line-height:1.1;color:var(--text);}
.ib-vnum.accent{font-size:18px;font-weight:800;color:var(--primary);}
.ratio-line{margin-top:9px;font-size:11.5px;color:var(--muted);line-height:1.5;}
.ratio-line b{color:var(--text);font-weight:700;}
.rl-main{margin-bottom:3px;}
.rl-yoy{margin-top:0;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.rl-yoy.up{color:var(--pos);}
.rl-yoy.down{color:var(--neg);}
.rl-yoy.flat{color:var(--muted);}
.ib-yoy{margin-top:10px;font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.ib-yoy.up{color:var(--pos);}
.ib-yoy.down{color:var(--neg);}
.ib-yoy.flat{color:var(--muted);}

/* 上升/下降三角形：明确红涨绿跌，加粗区分 */
.ar-up{color:var(--pos);font-weight:900;}
.ar-down{color:var(--neg);font-weight:900;}
.ar-flat{color:var(--muted);}

/* ===== C人力方阵卡片 ===== */
.ind-box.c-matrix{display:flex;flex-direction:column;}
.c-matrix .ib-head{justify-content:center;position:relative;margin-bottom:8px;}
.c-matrix .ib-name{font-size:var(--fs-matrix-title);font-weight:800;text-align:center;flex:none;line-height:1.25;}
.c-matrix .ib-tag{position:absolute;right:0;top:0;}
/* 方阵卡片：无表格线，除标题外字号统一 18px，靠间距与颜色区分 */
.c-grid{display:grid;grid-template-columns:64px 1fr 1fr;gap:7px 10px;margin-top:6px;}
.c-grid > div{padding:4px 4px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:var(--fs-matrix-body);}
.cg-corner{font-weight:700;color:var(--muted);}
.cg-h{font-weight:700;color:var(--muted);}
.cg-r{font-weight:700;color:var(--muted);justify-content:flex-start !important;padding-left:2px;}
.cg-v{font-weight:700;color:var(--text);}
.cg-v.accent{color:var(--primary);}
.cg-v.up{color:var(--pos);}
.cg-v.down{color:var(--neg);}
.cg-v.flat{color:var(--muted);}
/* 月均主管人力方阵变体：标题20px居中、其余15px、2列（维度|绝对值） */
.c-grid.cg-2col{grid-template-columns:64px 1fr;}
.c-matrix.yj .ib-name{font-size:var(--fs-matrix-title);}
.c-matrix.yj .c-grid>div{font-size:var(--fs-matrix-body);}

/* ===== 分公司对比 ===== */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.tab-btn{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:.2s;}
.tab-btn:hover{transform:translateY(-1px);}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.sel{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;}
.mode-group{border:1px solid var(--border);border-radius:9px;overflow:hidden;display:inline-flex;}
.mode-btn{cursor:pointer;border:none;background:var(--card);color:var(--text);padding:8px 14px;font-size:13px;font-weight:600;}
.mode-btn.active{background:var(--secondary);color:#fff;}
.compare-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px 10px;box-shadow:var(--shadow);}
.compare-card h3{margin:0 0 4px;font-size:15px;}
.compare-card .hint{font-size:12px;color:var(--muted);margin:0 0 8px;}
.canvas-box{position:relative;height:360px;}
.legend-inline{font-size:12px;color:var(--muted);margin:6px 0 0;display:flex;gap:16px;flex-wrap:wrap;}
.legend-inline .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.legend-inline .up{color:var(--pos);font-weight:700;}
.legend-inline .down{color:var(--neg);font-weight:700;}

/* ===== 明细表 ===== */
.table-card{margin-top:6px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:8px 6px;box-shadow:var(--shadow);overflow:auto;}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:1180px;}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:700;z-index:3;}
td.name,th.name{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600;z-index:2;}
th.name{z-index:4;}
tr.total td{font-weight:800;background:var(--accent-soft);}
td .up{color:var(--pos);font-weight:700;}
td .down{color:var(--neg);font-weight:700;}
td .flat{color:var(--muted);}
/* 分组头：左侧主色条 + 强背景 */
.cat-block td.group-head{background:var(--bg);font-weight:800;color:var(--text);text-align:left;padding-left:12px;border-left:4px solid var(--primary);}
/* 行层次：25年淡主色、同比淡灰、悬停高亮 */
.row-25 td{background:color-mix(in srgb,var(--primary) 7%, var(--card));}
.row-yoy td{background:color-mix(in srgb,var(--muted) 6%, var(--card));}
tbody tr:hover td{background:color-mix(in srgb,var(--primary) 11%, var(--card));}
/* 合计列高亮 */
td.total-col,th.total-col{background:color-mix(in srgb,var(--primary) 12%, var(--card));font-weight:700;color:var(--text);}
/* 明细表按类分块 + 外框层次 */
.cat-block td{border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);}
.cat-block tr.cat-head td{border-top:2.5px solid var(--primary);background:color-mix(in srgb,var(--primary) 9%, var(--card));font-weight:800;color:var(--text);text-align:left;padding-left:14px;font-size:13px;}
.cat-block tr:last-child td{border-bottom:2.5px solid var(--border);}
.cat-head .cat-cnt{float:right;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--card);padding:1px 9px;border-radius:999px;border:1px solid var(--border);}
.cat-gap td{border:none;height:9px;padding:0;background:transparent;}
.gh-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--primary);margin-left:6px;}
.code{font-weight:400;font-size:11px;color:var(--muted);}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.8;}
.note b{color:var(--text);}

/* ===== 完整明细 • 方案③ 卡片分组（转置：行=24年/25年/同比，列=分公司） ===== */
.cat-sec{margin-bottom:18px;}
.cat-sec-head{font-size:15px;font-weight:800;margin:14px 0 10px;display:flex;align-items:center;gap:9px;}
.cat-sec-head::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--primary);}
.cat-sec-head .cat-cnt{font-size:11.5px;color:var(--muted);background:var(--accent-soft);padding:2px 9px;border-radius:999px;font-weight:600;}
.card-grid{margin-bottom:4px;}
.ic-scroll{overflow-x:auto;}
.ind-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px 6px;box-shadow:var(--shadow);}
.ic-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--border);}
.ic-name{font-size:var(--fs-card-title);font-weight:700;color:var(--title-blue);}
.ic-tbl{border-collapse:collapse;width:100%;font-size:var(--fs-card-body);white-space:nowrap;min-width:auto;}
.ic-tbl th{background:var(--bg);color:var(--muted);font-weight:700;padding:5px 6px;font-size:var(--fs-card-head);}
.ic-tbl td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--border);}
.ic-tbl td.bn{text-align:left;font-weight:600;}
.ic-tbl td.accent{color:var(--primary);font-weight:700;}
.ic-tbl td.up{color:var(--pos);font-weight:700;}
.ic-tbl td.down{color:var(--neg);font-weight:700;}
.ic-tbl td.flat{color:var(--muted);}
.ic-tbl .total-col{background:color-mix(in srgb,var(--primary) 12%, var(--card));font-weight:700;}
/* 合并卡：人数组与占比组之间加分隔；标签高亮 */
.ic-tbl tr.grp-sep td{border-top:2px solid var(--border);}
.merged-card .gh-tag{color:var(--primary);background:var(--accent-soft);border:1px solid var(--accent-soft);}

.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px;}
@media(max-width:980px){.sys-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:620px){.sys-grid{grid-template-columns:repeat(1,1fr);}.canvas-box{height:300px;}}
@media print{.topbar{position:static;box-shadow:none;}.theme-switch,.print-btn,.controls,.tabs{display:none;}
  body{background:#fff;}
  .ic-scroll{overflow:visible;}
  table{min-width:auto !important;}
  .ind-card,.table-card,.cat-sec,.sys-cat,.sys-grid{break-inside:avoid;}
  .ind-card{box-shadow:none;}
}
</style>
</head>

const fmtV = v => { if(v===null||v===undefined) return "—"; const n=Number(v); return Math.abs(n-Math.round(n))<1e-9 ? String(Math.round(n)) : n.toFixed(1); };
const fmtPct = (x,type) => { if(x===null||x===undefined) return "—"; const n=Number(x)*100; const s=(n>=0?"+":"")+n.toFixed(1); return type==="ratio" ? s+"pp" : s+"%"; };
const yoyCls = x => x>1e-9 ? "up" : (x<-1e-9 ? "down" : "flat");
const arrow = x => x>1e-9 ? "▲" : (x<-1e-9 ? "▼" : "—");
const arrowHtml = x => `<span class="ar-${yoyCls(x)}">${arrow(x)}</span>`;

      <div class="c-grid">
        <div class="cg-corner">维度</div><div class="cg-h">24年</div><div class="cg-h">25年</div>
        <div class="cg-r">绝对值</div><div class="cg-v">${fmtV(t.v24)}</div><div class="cg-v accent">${fmtV(t.v25)}</div>
        <div class="cg-r">同比</div><div class="cg-v">—</div><div class="cg-v ${yoyCls(t.yoy)}">${arrowHtml(t.yoy)} ${fmtPct(t.yoy,ind.type)}</div>
      </div>
    </div>`;
  }
  // ===== 月均主管人力方阵卡片：标题居中20px深蓝、其余16px、2列（维度|绝对值）× 3行（24/25/同比） =====
  if(ind.cat==="月均人力"){
    return `<div class="ind-box c-matrix yj">
      <div class="ib-head"><span class="ib-name">${ind.name}</span><span class="ib-tag ${ind.type}">${tagText(ind)}</span></div>
      <div class="c-grid cg-2col">
        <div class="cg-corner">维度</div><div class="cg-h">绝对值</div>
        <div class="cg-r">24年</div><div class="cg-v">${fmtV(t.v24)}</div>
        <div class="cg-r">25年</div><div class="cg-v accent">${fmtV(t.v25)}</div>
        <div class="cg-r">同比</div><div class="cg-v ${yoyCls(t.yoy)}">${arrowHtml(t.yoy)} ${fmtPct(t.yoy,ind.type)}</div>
      </div>
    </div>`;
  }
  // ===== 其他（默认双栏，理论不触发） =====
  let v24txt,v25txt;
  if(ind.type==="ratio"){ v24txt=(t.v24*100).toFixed(1)+"%"; v25txt=(t.v25*100).toFixed(1)+"%"; }
  else { v24txt=fmtV(t.v24); v25txt=fmtV(t.v25); }
  const cls=yoyCls(t.yoy), ytxt=fmtPct(t.yoy, ind.type);
  return `<div class="ind-box">
    <div class="ib-head"><span class="ib-name">${ind.name}</span><span class="ib-tag ${ind.type}">${tagText(ind)}</span></div>
    <div class="ib-vals">
      <div class="ib-val"><span class="ib-vlabel">24年 • 绝对值</span><span class="ib-vnum">${v24txt}</span></div>
      <div class="ib-val"><span class="ib-vlabel">25年 • 绝对值</span><span class="ib-vnum accent">${v25txt}</span></div>
    </div>
    <div class="ib-yoy ${cls}">${arrowHtml(t.yoy)} 同比 ${ytxt}</div>
  </div>`;
}
(function buildSystem(){
  const wrap=document.getElementById("sysWrap");
  CATS.forEach(cat=>{
    const html=`<div class="sys-cat"><div class="sys-cat-head"><span class="sys-cat-title">${cat.key}</span><span class="sys-cat-count">${cat.items.length} 项指标</span></div><div class="sys-grid">`+
      cat.items.map(k=>indBoxHtml(getInd(k))).join("")+
      `</div></div>`;
    wrap.insertAdjacentHTML("beforeend", html);
  });
})();

/* ===== 二、分公司对比 ===== */
const CAT_OPTS = {
  "月均人力":   ["ind1"],
  "各C人力":    ["ind2","ind4","ind6","ind8","ind10"],
  "各期交人力": ["ind12","ind13","ind14","ind15","ind16","ind17"],
};
const catState = {
  "月均人力":   {sel:"ind1",  mode:"count"},
  "各C人力":    {sel:"ind2",  mode:"count"},
  "各期交人力": {sel:"ind12", mode:"count"},
};
let curCat="月均人力";
let compareChart=null;

const valLabel = {
  id:"valLabel",
  afterDatasetsDraw(chart){
    const {ctx}=chart;
    ctx.save();
    ctx.font="600 11px sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="bottom";
    chart.data.datasets.forEach((ds,di)=>{
      if(ds._hideLabel) return;
      const meta=chart.getDatasetMeta(di);
      if(meta.hidden) return;
      meta.data.forEach((el,i)=>{
        const v=ds.data[i];
        if(v===null||v===undefined) return;
        ctx.fillStyle = ds.type==="line" ? "#92400e" : curTheme.tick;
        let txt = ds.type==="line" ? ((v>=0?"+":"")+v+"%") : chart.$valFmt(v);
        ctx.fillText(txt, el.x, el.y-4);
      });
    });
    ctx.restore();
  }
};

function buildCompare(){
  const st=catState[curCat];
  let ind=getInd(st.sel);
  if(curCat==="各C人力" && st.mode==="ratio"){ ind=getInd(ind.ratioRef); }
  const isRatio = ind.type==="ratio";
  const labels=branches.map(b=>b.name);
  const v24=branches.map(b=>+ind.data[b.name].v24);
  const v25=branches.map(b=>+ind.data[b.name].v25);
  const yoy=branches.map(b=>+(ind.data[b.name].yoy*100).toFixed(1));
  const valFmt = isRatio ? (v=>(v*100).toFixed(1)+"%") : fmtV;
  const unit = isRatio ? "占比" : (curCat==="各期交人力" ? "人（累计）" : "人/月（月均）");
  const modeLabel = (curCat==="各C人力") ? (st.mode==="ratio"?"占比":"人数") : "";

  document.getElementById("cmpTitle").textContent = `${ind.name}${modeLabel?"（"+modeLabel+"）":""}`;
  document.getElementById("cmpHint").textContent = `单位：${unit} • 柱=24年/25年数值，折线=同比（%）`;

  const cfg={
    type:"bar",
    data:{labels,
      datasets:[
        {label:"2024年",data:v24,backgroundColor:curTheme.primary,borderRadius:5},
        {label:"2025年",data:v25,backgroundColor:curTheme.secondary,borderRadius:5},
        {label:"同比",data:yoy,type:"line",yAxisID:"y1",borderColor:YOYLINE,backgroundColor:YOYLINE,
         borderWidth:2,tension:.3,pointRadius:4,pointHoverRadius:6,
         pointBackgroundColor:yoy.map(s=>s>1e-9?POS:(s<-1e-9?NEG:FLAT)),
         _hideLabel:false},
      ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:18}},
      plugins:{
        legend:{labels:{color:curTheme.tick,usePointStyle:true,boxWidth:8}},
        tooltip:{callbacks:{
          label:c=>{
            if(c.dataset.type==="line") return "同比："+(c.parsed.y>=0?"+":"")+c.parsed.y+"%";
            const raw=c.dataset.data[c.dataIndex];
            return c.dataset.label+": "+(isRatio?(raw*100).toFixed(1)+"%":fmtV(raw));
          }
        }}
      },
      scales:{
        x:{ticks:{color:curTheme.tick},grid:{display:false}},
        y:{beginAtZero:true,ticks:{color:curTheme.tick},grid:{color:curTheme.grid},title:{display:true,text:unit,color:curTheme.tick}},
        y1:{position:"right",beginAtZero:true,grid:{drawOnChartArea:false},ticks:{color:curTheme.tick,callback:v=>v+"%"},title:{display:true,text:"同比%",color:curTheme.tick}},
      }
    },
    plugins:[valLabel]
  };
  if(compareChart) compareChart.destroy();
  compareChart=new Chart(document.getElementById("cmpChart"),cfg);
  compareChart.$valFmt=valFmt;
  // 图例色块同步主题
  document.getElementById("lg24").style.background=curTheme.primary;
  document.getElementById("lg25").style.background=curTheme.secondary;
}

function renderControls(){
  const sel=document.getElementById("selInd");
  const toggle=document.getElementById("modeToggle");
  if(curCat==="月均人力"){ sel.style.display="none"; toggle.style.display="none"; }
  else {
    sel.style.display="";
    sel.innerHTML=CAT_OPTS[curCat].map(k=>`<option value="${k}">${getInd(k).name}</option>`).join("");
    sel.value=catState[curCat].sel;
    if(curCat==="各C人力"){ toggle.style.display=""; document.querySelectorAll(".mode-btn").forEach(x=>x.classList.toggle("active",x.dataset.mode===catState[curCat].mode)); }
    else toggle.style.display="none";
  }
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    curCat=btn.dataset.cat;
    renderControls();
    buildCompare();
  };
});
document.getElementById("selInd").onchange=e=>{ catState[curCat].sel=e.target.value; buildCompare(); };
document.querySelectorAll(".mode-btn").forEach(b=>{
  b.onclick=()=>{ catState[curCat].mode=b.dataset.mode; document.querySelectorAll(".mode-btn").forEach(x=>x.classList.remove("active")); b.classList.add("active"); buildCompare(); };
});

/* ===== 三、完整明细（方案③ 卡片分组 • 转置：行=维度，列=分公司） =====
   各C人力：同一 C 级的「人数(count) + 占比(ratio)」合并为一张表（6 行：24年/25年/同比/24年占比/25年占比/同比占比）。 */
(function buildDetail(){
  const order=[]; const map={};
  inds.forEach(ind=>{ if(!map[ind.cat]){ map[ind.cat]=[]; order.push(ind.cat); } map[ind.cat].push(ind); });
  let html="";
  order.forEach(cat=>{
    let cardsHtml="";
    let cntLabel=map[cat].length;
    if(cat==="各C人力"){
      const counts=map[cat].filter(i=>i.type==="count");
      cntLabel=counts.length;
      counts.forEach(ind=>{
        const ratioInd=getInd(ind.ratioRef);
        const colHeads = allRows.map(r=>`<th class="${r===totalRow?'total-col':''}">${r.name}</th>`).join("");
        const rowDefs = [
          {label:"24年",      d:ind.data,     key:"v24"},
          {label:"25年",      d:ind.data,     key:"v25"},
          {label:"同比",      d:ind.data,     key:"yoy", isYoy:true},
          {label:"24年占比",  d:ratioInd.data, key:"v24", isRatio:true, sep:true},
          {label:"25年占比",  d:ratioInd.data, key:"v25", isRatio:true},
          {label:"同比占比",  d:ratioInd.data, key:"yoy", isRatio:true, isYoy:true}
        ];
        const bodyRows = rowDefs.map(rd=>{
          const cells = allRows.map(r=>{
            const d = rd.d[r.name];
            let val="—", cls="";
            if(rd.isYoy){
              const yv = d&&d.yoy!=null ? d.yoy : null;
              if(yv!=null){ val = arrowHtml(yv)+" "+fmtPct(yv, rd.isRatio?"ratio":ind.type); cls = yoyCls(yv); }
            } else {
              const v = d&&d[rd.key]!=null ? d[rd.key] : null;
              if(v!=null){ val = rd.isRatio ? (v*100).toFixed(1)+"%" : fmtV(v); if(rd.key==="v25" && !rd.isRatio) cls="accent"; }
            }
            const tcls = (r===totalRow)?" total-col":"";
            return `<td class="${cls}${tcls}">${val}</td>`;
          }).join("");
          const sepCls = rd.sep ? " grp-sep":"";
          return `<tr class="${sepCls}"><td class="bn">${rd.label}</td>${cells}</tr>`;
        }).join("");
        cardsHtml+=`<div class="ind-card merged-card"><div class="ic-head"><span class="ic-name">${ind.name}</span><span class="gh-tag">人数+占比</span></div><div class="ic-scroll"><table class="ic-tbl"><thead><tr><th>维度</th>${colHeads}</tr></thead><tbody>${bodyRows}</tbody></table></div></div>`;
      });
    } else {
      map[cat].forEach(ind=>{
        const tag=tagText(ind);
        const colHeads = allRows.map(r=>`<th class="${r===totalRow?'total-col':''}">${r.name}</th>`).join("");
        const rowDefs = [
          {label:"24年", key:"v24"},
          {label:"25年", key:"v25"},
          {label:"同比", key:"yoy", isYoy:true}
        ];
        const bodyRows = rowDefs.map(rd=>{
          const cells = allRows.map(r=>{
            const d = ind.data[r.name];
            let val="—", cls="";
            if(rd.isYoy){
              const yv = d&&d.yoy!=null ? d.yoy : null;
              if(yv!=null){ val = arrowHtml(yv)+" "+fmtPct(yv,ind.type); cls = yoyCls(yv); }
              else { val="—"; cls="flat"; }
            } else {
              const v = d&&d[rd.key]!=null ? d[rd.key] : null;
              if(v!=null){ val = ind.type==="ratio" ? (v*100).toFixed(1)+"%" : fmtV(v); if(rd.key==="v25") cls="accent"; }
              else { val="—"; }
            }
            const tcls = (r===totalRow)?" total-col":"";
            return `<td class="${cls}${tcls}">${val}</td>`;
          }).join("");
          return `<tr><td class="bn">${rd.label}</td>${cells}</tr>`;
        }).join("");
        cardsHtml+=`<div class="ind-card"><div class="ic-head"><span class="ic-name">${ind.name}</span><span class="gh-tag">${tag}</span></div><div class="ic-scroll"><table class="ic-tbl"><thead><tr><th>维度</th>${colHeads}</tr></thead><tbody>${bodyRows}</tbody></table></div></div>`;
      });
    }
    html+=`<div class="cat-sec"><div class="cat-sec-head">${cat}<span class="cat-cnt">${cntLabel} 项</span></div><div class="card-grid">${cardsHtml}</div></div>`;
  });
  document.getElementById("detail").innerHTML = html;
})();

/* ===== 主题切换 ===== */
function applyTheme(id){
  document.body.className=id;
  curTheme=THEMES.find(t=>t.id===id);
  document.querySelectorAll(".theme-btn").forEach(x=>x.classList.toggle("active",x.dataset.id===id));
  if(compareChart){
    compareChart.data.datasets[0].backgroundColor=curTheme.primary;
    compareChart.data.datasets[1].backgroundColor=curTheme.secondary;
    compareChart.options.plugins.legend.labels.color=curTheme.tick;
    compareChart.options.scales.x.ticks.color=curTheme.tick;
    compareChart.options.scales.y.ticks.color=curTheme.tick;
    compareChart.options.scales.y.grid.color=curTheme.grid;
    compareChart.options.scales.y.title.color=curTheme.tick;
    compareChart.options.scales.y1.ticks.color=curTheme.tick;
    compareChart.options.scales.y1.title.color=curTheme.tick;
    document.getElementById("lg24").style.background=curTheme.primary;
    document.getElementById("lg25").style.background=curTheme.secondary;
    compareChart.update("none");
  }
}
(function(){
  const box=document.getElementById("themeSwitch");
  THEMES.forEach((th,i)=>{
    const b=document.createElement("div");
    b.className="theme-btn"+(i===0?" active":"");
    b.dataset.id=th.id;
    b.innerHTML=`<span class="dot" style="background:${th.dot}"></span>${th.name}`;
    b.onclick=()=>applyTheme(th.id);
    box.appendChild(b);
  });
  applyTheme(THEMES[0].id);
})();

renderControls();
buildCompare();

/* ===== 导出高保真PDF：直接调用浏览器打印（所见即所得） ===== */
</script>
</body>
</html>
