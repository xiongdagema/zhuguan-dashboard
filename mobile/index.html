/* ===== 主题变量（与主文件一致，5 套可切） ===== */
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --primary:#2563eb; --secondary:#06b6d4; --border:#e5e7eb;
  --pos:#e23c3c; --neg:#1f9d55; --shadow:0 6px 20px rgba(20,40,80,.08);
  --accent-soft:rgba(37,99,235,.12);
  --title-blue:#1e40af;
}
body.theme-tech{--bg:#eef2fb;--card:#ffffff;--text:#16243b;--muted:#5b6b86;--primary:#2563eb;--secondary:#06b6d4;--border:#dbe4f3;--pos:#e23c3c;--neg:#1f9d55;--accent-soft:rgba(37,99,235,.12);}
body.theme-redgold{--bg:#fbf6f0;--card:#ffffff;--text:#3a2a1c;--muted:#8a6f57;--primary:#c0392b;--secondary:#d4af37;--border:#f0dcc8;--pos:#c0392b;--neg:#1f9d55;--accent-soft:rgba(192,57,43,.10);}
body.theme-green{--bg:#f1faf5;--card:#ffffff;--text:#173a2c;--muted:#5f7d6c;--primary:#059669;--secondary:#10b981;--border:#d4ecdf;--pos:#e23c3c;--neg:#1f9d55;--accent-soft:rgba(5,150,105,.12);}
body.theme-dark{--bg:#0b1220;--card:#15203a;--text:#e6edf7;--muted:#93a4c0;--primary:#38bdf8;--secondary:#a78bfa;--border:#243352;--pos:#fb7185;--neg:#34d399;--accent-soft:rgba(56,189,248,.16);--shadow:0 8px 28px rgba(0,0,0,.45);--title-blue:#82a9ff;}
body.theme-gray{--bg:#f5f6f8;--card:#ffffff;--text:#2b2f36;--muted:#7c828c;--primary:#475569;--secondary:#94a3b8;--border:#e6e8ec;--pos:#e23c3c;--neg:#1f9d55;--accent-soft:rgba(71,85,105,.10);}
body.theme-antgold{--bg:#141414;--card:#1f1f1f;--text:rgba(255,255,255,.88);--muted:rgba(255,255,255,.50);--primary:#faad14;--secondary:#ffc53d;--border:#434343;--pos:#ff4d4f;--neg:#52c41a;--accent-soft:rgba(250,173,20,.14);--shadow:0 8px 28px rgba(0,0,0,.55);--title-blue:#faad14;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text);transition:background .35s,color .35s;font-size:14px;line-height:1.4;}

/* 容器：手机宽度，居中，随屏缩放（max 480 适配大屏手机） */
.wrap{max-width:480px;margin:0 auto;padding:10px 12px 48px;}

/* 顶栏（紧凑，主题切换换行） */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);}
.title-wrap h1{margin:0;font-size:16px;letter-spacing:.3px;}
.top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.theme-switch{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
.theme-switch::-webkit-scrollbar{display:none;}
.theme-btn{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);padding:3px 7px;border-radius:999px;font-size:10px;display:flex;align-items:center;gap:4px;line-height:1;white-space:nowrap;}
.theme-btn .dot{width:8px;height:8px;border-radius:50%;}
.theme-btn.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--accent-soft);font-weight:600;}
.print-btn{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);padding:4px 9px;border-radius:999px;font-size:11px;}

/* 区块标题 */
.section-title{margin:18px 2px 10px;font-size:15px;font-weight:700;color:var(--title-blue);border-left:4px solid var(--primary);padding-left:8px;}

/* ===== 一、系统指标：2列×3行，模块随屏缩放 ===== */
.sys-cat{margin-bottom:12px;}
.sys-cat-head{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;}
.sys-cat-title{font-size:13px;font-weight:700;color:var(--text);}
.sys-cat-count{font-size:11px;color:var(--muted);}
.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ind-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 10px;box-shadow:var(--shadow);}
.ib-head{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:6px;}
.ib-name{font-size:12px;font-weight:700;color:var(--title-blue);line-height:1.25;}
.ib-tag{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 5px;white-space:nowrap;}
.c-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px 6px;font-size:11px;}
.c-grid.cg-2col{grid-template-columns:auto 1fr;}
.cg-corner{font-size:10px;color:var(--muted);font-weight:600;}
.cg-h{font-size:10px;color:var(--muted);font-weight:600;text-align:center;}
.cg-r{color:var(--muted);}
.cg-v{font-weight:600;text-align:center;white-space:nowrap;}
.cg-v.accent{color:var(--primary);}
.up{color:var(--pos);} .down{color:var(--neg);} .flat{color:var(--muted);}
.ar-up{color:var(--pos);} .ar-down{color:var(--neg);} .ar-flat{color:var(--muted);}

/* ===== 二、分公司对比（手机优化：去刻度/网格、名字全显、拉高） ===== */
.tabs{display:flex;gap:6px;margin-bottom:8px;}
.tab-btn{cursor:pointer;flex:1;text-align:center;padding:7px 4px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:12px;}
.tab-btn.active{border-color:var(--primary);background:var(--accent-soft);font-weight:700;color:var(--primary);}
.controls{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.sel{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;background:var(--card);color:var(--text);max-width:62%;}
.mode-group{display:flex;gap:4px;}
.mode-btn{cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;background:var(--card);color:var(--text);}
.mode-btn.active{border-color:var(--primary);background:var(--accent-soft);color:var(--primary);font-weight:700;}
.compare-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 10px;box-shadow:var(--shadow);}
.compare-card h3{margin:0 0 2px;font-size:13px;font-weight:700;}
.compare-card .hint{margin:0 0 8px;font-size:11px;color:var(--muted);}
.canvas-box{width:100%;height:270px;}
.legend-inline{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--muted);}
.legend-inline .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;}

/* ===== 三、完整明细（转置：列=24/25/同比，行=分公司，纵向滚动） ===== */
.cat-sec{margin-bottom:14px;}
.cat-sec-head{font-size:13px;font-weight:700;margin-bottom:7px;color:var(--text);}
.cat-sec-head .cat-cnt{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;}
.ind-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 10px;margin-bottom:9px;box-shadow:var(--shadow);}
.ic-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;}
.ic-name{font-size:12.5px;font-weight:700;color:var(--title-blue);}
.gh-tag{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 5px;white-space:nowrap;}
.ic-tbl{width:100%;border-collapse:collapse;font-size:11.5px;}
.ic-tbl th{font-size:10.5px;color:var(--muted);font-weight:600;text-align:right;padding:4px 5px;border-bottom:1px solid var(--border);}
.ic-tbl th.bn,.ic-tbl td.bn{text-align:left;}
.ic-tbl td{padding:4px 5px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
.ic-tbl tr:last-child td{border-bottom:none;}
.ic-tbl .bn{font-weight:600;color:var(--text);}
.ic-tbl .accent{color:var(--primary);font-weight:700;}
.ic-tbl .total-row{background:var(--accent-soft);}
.ic-tbl .total-row td{border-top:1px solid var(--border);font-weight:700;}

/* 合并表：同一 C 级「人数 + 占比」合为一张 7 列表（分公司/24年/25年/同比/24占/25占/同比占） */
.ic-tbl.merged th,.ic-tbl.merged td{padding:4px 3px;}
.ic-tbl.merged th.sep,.ic-tbl.merged td.sep{border-left:2px solid var(--border);}
.merged-card .gh-tag{color:var(--primary);border-color:var(--accent-soft);background:var(--accent-soft);}

/* 期交合并表：双行表头列分组（分公司 / 100万人力[24年•25年•同比] / 200万… / 300万…） */
.ic-tbl.qt-merged{table-layout:fixed;width:100%;}
.ic-tbl.qt-merged th,.ic-tbl.qt-merged td{padding:3px 1px;font-size:9px;white-space:nowrap;}
.ic-tbl.qt-merged th.bn,.ic-tbl.qt-merged td.bn{text-align:left;}
.ic-tbl.qt-merged thead tr:first-child th{border-bottom:1px solid var(--border);}
.ic-tbl.qt-merged th.tgrp{text-align:center;font-size:9.5px;font-weight:700;color:var(--title-blue);}
.ic-tbl.qt-merged th[rowspan]{vertical-align:middle;text-align:left;}
.ic-tbl.qt-merged tbody td{border-bottom:1px solid var(--border);}
.ic-tbl.qt-merged tbody tr:last-child td{border-bottom:none;}

@media (max-width:360px){
  body{font-size:13px;}
  .sys-grid{gap:6px;}
  .canvas-box{height:240px;}
  .ic-tbl{font-size:11px;}
  .ib-name,.ic-name{font-size:11.5px;}
}
</style>
</head>

/* ===== 基础取数（DATA 由生成脚本注入到同脚本顶部） ===== */
const branches = DATA.branches.filter(b=>b.code!==null);
const totalRow = DATA.branches.find(b=>b.code===null);
const allRows = [...branches, totalRow];
const inds = DATA.indicators;
const getInd = k => inds.find(i=>i.key===k);

const fmtV = v => { if(v===null||v===undefined) return "—"; const n=Number(v); return Math.abs(n-Math.round(n))<1e-9 ? String(Math.round(n)) : n.toFixed(1); };
const fmtPct = (x,type) => { if(x===null||x===undefined) return "—"; const n=Number(x)*100; const s=(n>=0?"+":"")+n.toFixed(1); return type==="ratio" ? s+"pp" : s+"%"; };
const yoyCls = x => x>1e-9 ? "up" : (x<-1e-9 ? "down" : "flat");
const arrow = x => x>1e-9 ? "▲" : (x<-1e-9 ? "▼" : "—");
const arrowHtml = x => `<span class="ar-${yoyCls(x)}">${arrow(x)}</span>`;
const tagText = ind => ind.type==="ratio" ? "占比" : (ind.cat==="各期交人力" ? "累计" : "月均");

function indBoxHtml(ind){
  const t=ind.data["合计"];
  if(ind.type==="count" && ind.cat==="各C人力" && ind.ratio){
    const r=ind.ratio["合计"];
    return `<div class="ind-box c-matrix">
      <div class="ib-head"><span class="ib-name">${ind.name}</span><span class="ib-tag ${ind.type}">${tagText(ind)}</span></div>
      <div class="c-grid">
        <div class="cg-corner">维度</div><div class="cg-h">绝对值</div><div class="cg-h">占比</div>
        <div class="cg-r">24年</div><div class="cg-v">${fmtV(t.v24)}</div><div class="cg-v">${(r.v24*100).toFixed(1)}%</div>
        <div class="cg-r">25年</div><div class="cg-v accent">${fmtV(t.v25)}</div><div class="cg-v accent">${(r.v25*100).toFixed(1)}%</div>
        <div class="cg-r">同比</div><div class="cg-v ${yoyCls(t.yoy)}">${arrowHtml(t.yoy)} ${fmtPct(t.yoy,ind.type)}</div><div class="cg-v ${yoyCls(r.yoy)}">${arrowHtml(r.yoy)} ${fmtPct(r.yoy,"ratio")}</div>
      </div>
    </div>`;
  }
  if(ind.cat==="各期交人力"){
    return `<div class="ind-box c-matrix">
      <div class="ib-head"><span class="ib-name">${ind.name}</span><span class="ib-tag ${ind.type}">${tagText(ind)}</span></div>
      <div class="c-grid cg-2col">
        <div class="cg-corner">维度</div><div class="cg-h">绝对值</div>
        <div class="cg-r">24年</div><div class="cg-v">${fmtV(t.v24)}</div>
        <div class="cg-r">25年</div><div class="cg-v accent">${fmtV(t.v25)}</div>
        <div class="cg-r">同比</div><div class="cg-v ${yoyCls(t.yoy)}">${arrowHtml(t.yoy)} ${fmtPct(t.yoy,ind.type)}</div>
      </div>
    </div>`;
  }
  if(ind.cat==="月均人力"){
    return `<div class="ind-box c-matrix">
      <div class="ib-head"><span class="ib-name">${ind.name}</span><span class="ib-tag ${ind.type}">${tagText(ind)}</span></div>
      <div class="c-grid cg-2col">
        <div class="cg-corner">维度</div><div class="cg-h">绝对值</div>
        <div class="cg-r">24年</div><div class="cg-v">${fmtV(t.v24)}</div>
        <div class="cg-r">25年</div><div class="cg-v accent">${fmtV(t.v25)}</div>
        <div class="cg-r">同比</div><div class="cg-v ${yoyCls(t.yoy)}">${arrowHtml(t.yoy)} ${fmtPct(t.yoy,ind.type)}</div>
      </div>
    </div>`;
  }
  let v24txt,v25txt;
  if(ind.type==="ratio"){ v24txt=(t.v24*100).toFixed(1)+"%"; v25txt=(t.v25*100).toFixed(1)+"%"; }
  else { v24txt=fmtV(t.v24); v25txt=fmtV(t.v25); }
  const cls=yoyCls(t.yoy), ytxt=fmtPct(t.yoy, ind.type);
  return `<div class="ind-box">
    <div class="ib-head"><span class="ib-name">${ind.name}</span><span class="ib-tag ${ind.type}">${tagText(ind)}</span></div>
    <div class="c-grid">
      <div class="cg-corner">维度</div><div class="cg-h">绝对值</div>
      <div class="cg-r">24年</div><div class="cg-v">${v24txt}</div>
      <div class="cg-r">25年</div><div class="cg-v accent">${v25txt}</div>
      <div class="cg-r">同比</div><div class="cg-v ${cls}">${arrowHtml(t.yoy)} ${ytxt}</div>
    </div>
  </div>`;
}
(function buildSystem(){
  const wrap=document.getElementById("sysWrap");

/* ===== 二、分公司对比（手机优化） ===== */
const CAT_OPTS = {
  "月均人力":   ["ind1"],
  "各C人力":    ["ind2","ind4","ind6","ind8","ind10"],
  "各期交人力": ["ind12","ind13","ind14","ind15","ind16","ind17"],
};
const catState = {
  "月均人力":   {sel:"ind1",  mode:"count"},
  "各C人力":    {sel:"ind2",  mode:"count"},
  "各期交人力": {sel:"ind12", mode:"count"},
};
let curCat="月均人力";
let compareChart=null;

const valLabel = {
  id:"valLabel",
  afterDatasetsDraw(chart){
    const {ctx}=chart; ctx.save();
    ctx.font="600 10px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="bottom";
    chart.data.datasets.forEach((ds,di)=>{
      if(ds._hideLabel) return;
      const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
      meta.data.forEach((el,i)=>{
        const v=ds.data[i]; if(v===null||v===undefined) return;
        ctx.fillStyle = ds.type==="line" ? "#92400e" : curTheme.tick;
        let txt = ds.type==="line" ? ((v>=0?"+":"")+v+"%") : chart.$valFmt(v);
        ctx.fillText(txt, el.x, el.y-3);
      });
    });
    ctx.restore();
  }
};

function buildCompare(){
  const st=catState[curCat];
  let ind=getInd(st.sel);
  if(curCat==="各C人力" && st.mode==="ratio"){ ind=getInd(ind.ratioRef); }
  const isRatio = ind.type==="ratio";
  const labels=branches.map(b=>b.name);
  const v24=branches.map(b=>+ind.data[b.name].v24);
  const v25=branches.map(b=>+ind.data[b.name].v25);
  const yoy=branches.map(b=>+(ind.data[b.name].yoy*100).toFixed(1));
  const valFmt = isRatio ? (v=>(v*100).toFixed(1)+"%") : fmtV;
  const unit = isRatio ? "占比" : (curCat==="各期交人力" ? "人（累计）" : "人/月（月均）");
  const modeLabel = (curCat==="各C人力") ? (st.mode==="ratio"?"占比":"人数") : "";

  document.getElementById("cmpTitle").textContent = `${ind.name}${modeLabel?"（"+modeLabel+"）":""}`;
  document.getElementById("cmpHint").textContent = `单位：${unit} • 柱=24年/25年，折线=同比`;

  const cfg={
    type:"bar",
    data:{labels,
      datasets:[
        {label:"2024年",data:v24,backgroundColor:curTheme.primary,borderRadius:4},
        {label:"2025年",data:v25,backgroundColor:curTheme.secondary,borderRadius:4},
        {label:"同比",data:yoy,type:"line",yAxisID:"y1",borderColor:YOYLINE,backgroundColor:YOYLINE,
         borderWidth:2,tension:.3,pointRadius:3,pointHoverRadius:5,
         pointBackgroundColor:yoy.map(s=>s>1e-9?POS:(s<-1e-9?NEG:FLAT)),
         _hideLabel:false},
      ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:16,bottom:6}},
      plugins:{
        legend:{labels:{color:curTheme.tick,usePointStyle:true,boxWidth:8,font:{size:11}}},
        tooltip:{callbacks:{
          label:c=>{
            if(c.dataset.type==="line") return "同比："+(c.parsed.y>=0?"+":"")+c.parsed.y+"%";
            const raw=c.dataset.data[c.dataIndex];
            return c.dataset.label+": "+(isRatio?(raw*100).toFixed(1)+"%":fmtV(raw));
          }
        }}
      },
      scales:{
        // 用户要求：去掉纵坐标刻度与网格线（具体值已由柱顶标签显示）
        x:{ticks:{color:curTheme.tick,font:{size:10},autoSkip:false,maxRotation:0,minRotation:0},grid:{display:false}},
        y:{beginAtZero:true,ticks:{display:false},grid:{display:false}},
        y1:{position:"right",beginAtZero:true,grid:{display:false},ticks:{display:false}}
      }
    },
    plugins:[valLabel]
  };
  if(compareChart) compareChart.destroy();
  compareChart=new Chart(document.getElementById("cmpChart"),cfg);
  compareChart.$valFmt=valFmt;
  document.getElementById("lg24").style.background=curTheme.primary;
  document.getElementById("lg25").style.background=curTheme.secondary;
}

function renderControls(){
  const sel=document.getElementById("selInd");
  const toggle=document.getElementById("modeToggle");
  if(curCat==="月均人力"){ sel.style.display="none"; toggle.style.display="none"; }
  else {
    sel.style.display="";
    sel.innerHTML=CAT_OPTS[curCat].map(k=>`<option value="${k}">${getInd(k).name}</option>`).join("");
    sel.value=catState[curCat].sel;
    if(curCat==="各C人力"){ toggle.style.display=""; document.querySelectorAll(".mode-btn").forEach(x=>x.classList.toggle("active",x.dataset.mode===catState[curCat].mode)); }
    else toggle.style.display="none";
  }
}

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    curCat=btn.dataset.cat; renderControls(); buildCompare();
  };
});
document.getElementById("selInd").onchange=e=>{ catState[curCat].sel=e.target.value; buildCompare(); };
document.querySelectorAll(".mode-btn").forEach(b=>{
  b.onclick=()=>{ catState[curCat].mode=b.dataset.mode; document.querySelectorAll(".mode-btn").forEach(x=>x.classList.remove("active")); b.classList.add("active"); buildCompare(); };
});

/* ===== 三、完整明细（转置：列=24年/25年/同比，行=分公司） =====
   各C人力：同一 C 级「人数 + 占比」合并为一张 7 列表，避免 10 张表重复。 */
(function buildDetail(){
  const order=[]; const map={};
  inds.forEach(ind=>{ if(!map[ind.cat]){ map[ind.cat]=[]; order.push(ind.cat); } map[ind.cat].push(ind); });
  let html="";
  order.forEach(cat=>{
    let cardsHtml="";
    let cntLabel=map[cat].length;
    if(cat==="各C人力"){
      const counts=map[cat].filter(i=>i.type==="count");
      cntLabel=counts.length;
      counts.forEach(ind=>{
        const ratioInd=getInd(ind.ratioRef);
        const head=`<th class="bn">分公司</th><th>24年-绝对值</th><th>25年-绝对值</th><th>同比-绝对值</th>`+
                    `<th class="sep">24年-占比</th><th>25年-占比</th><th>同比-占比</th>`;
        const body=allRows.map(r=>{
          const d=ind.data[r.name];
          const rd=ratioInd.data[r.name];
          const isTot=(r===totalRow);
          const v24=(d&&d.v24!=null)?fmtV(d.v24):"—";
          const v25=(d&&d.v25!=null)?fmtV(d.v25):"—";
          let yv="—",ycls="flat";
          if(d&&d.yoy!=null){ yv=arrowHtml(d.yoy)+" "+fmtPct(d.yoy,"count"); ycls=yoyCls(d.yoy); }
          const rv24=(rd&&rd.v24!=null)?(rd.v24*100).toFixed(1)+"%":"—";
          const rv25=(rd&&rd.v25!=null)?(rd.v25*100).toFixed(1)+"%":"—";
          let ryv="—",rycls="flat";
          if(rd&&rd.yoy!=null){ ryv=arrowHtml(rd.yoy)+" "+fmtPct(rd.yoy,"ratio"); rycls=yoyCls(rd.yoy); }
          return `<tr class="${isTot?'total-row':''}">`+
            `<td class="bn">${r.name}</td>`+
            `<td>${v24}</td>`+
            `<td class="accent">${v25}</td>`+
            `<td class="${ycls}">${yv}</td>`+
            `<td class="sep">${rv24}</td>`+
            `<td>${rv25}</td>`+
            `<td class="${rycls}">${ryv}</td>`+
            `</tr>`;
        }).join("");
        cardsHtml+=`<div class="ind-card merged-card"><div class="ic-head"><span class="ic-name">${ind.name}</span><span class="gh-tag">人数+占比</span></div><table class="ic-tbl merged"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
      });
    } else if(cat==="各期交人力"){
      const QT_GROUPS=[
        {name:"期交100-300万人力", items:["ind12","ind13","ind14"]},
        {name:"期交500-1000万人力", items:["ind15","ind16","ind17"]}
      ];
      cntLabel=QT_GROUPS.length;
      QT_GROUPS.forEach(g=>{
        const grpHead=g.items.map(k=>`<th class="tgrp" colspan="3">${getInd(k).name.replace("期交","").replace("人力","")}</th>`).join("");
        const subHead=g.items.map(k=>`<th>24年</th><th>25年</th><th>同比</th>`).join("");
        const head=`<tr><th class="bn" rowspan="2">分公司</th>${grpHead}</tr><tr>${subHead}</tr>`;
        const body=allRows.map(r=>{
          const isTot=(r===totalRow);
          const cells=g.items.map(k=>{
            const ind=getInd(k);
            const d=ind.data[r.name];
            const v24=(d&&d.v24!=null)?fmtV(d.v24):"—";
            const v25=(d&&d.v25!=null)?fmtV(d.v25):"—";
            let yv="—",ycls="flat";
            if(d&&d.yoy!=null){ yv=fmtPct(d.yoy,"count"); ycls=yoyCls(d.yoy); }
            return `<td>${v24}</td><td class="accent">${v25}</td><td class="${ycls}">${yv}</td>`;
          }).join("");
          return `<tr class="${isTot?'total-row':''}"><td class="bn">${r.name}</td>${cells}</tr>`;
        }).join("");
        const colgroup=`<colgroup><col style="width:46px"><col style="width:26px"><col style="width:26px"><col style="width:44px">`+
                       `<col style="width:26px"><col style="width:26px"><col style="width:44px">`+
                       `<col style="width:26px"><col style="width:26px"><col style="width:44px"></colgroup>`;
        cardsHtml+=`<div class="ind-card merged-card"><div class="ic-head"><span class="ic-name">${g.name}</span><span class="gh-tag">三期合并</span></div><table class="ic-tbl merged qt-merged">${colgroup}<thead>${head}</thead><tbody>${body}</tbody></table></div>`;
      });
    } else {
      map[cat].forEach(ind=>{
        const tag=tagText(ind);
        const head=`<th class="bn">分公司</th><th>24年</th><th>25年</th><th>同比</th>`;
        const body=allRows.map(r=>{
          const d=ind.data[r.name];
          const isTot=(r===totalRow);
          const v24=(d&&d.v24!=null)?(ind.type==="ratio"?(d.v24*100).toFixed(1)+"%":fmtV(d.v24)):"—";
          const v25=(d&&d.v25!=null)?(ind.type==="ratio"?(d.v25*100).toFixed(1)+"%":fmtV(d.v25)):"—";
          let yv="—",ycls="flat";
          if(d&&d.yoy!=null){ yv=arrowHtml(d.yoy)+" "+fmtPct(d.yoy,ind.type); ycls=yoyCls(d.yoy); }
          return `<tr class="${isTot?'total-row':''}"><td class="bn">${r.name}</td><td>${v24}</td><td class="accent">${v25}</td><td class="${ycls}">${yv}</td></tr>`;
        }).join("");
        cardsHtml+=`<div class="ind-card"><div class="ic-head"><span class="ic-name">${ind.name}</span><span class="gh-tag">${tag}</span></div><table class="ic-tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
      });
    }
    html+=`<div class="cat-sec"><div class="cat-sec-head">${cat}<span class="cat-cnt">${cntLabel} 项</span></div>${cardsHtml}</div>`;
  });
  document.getElementById("detail").innerHTML = html;
})();

/* ===== 主题切换 ===== */
function applyTheme(id){
  document.body.className=id;
  curTheme=THEMES.find(t=>t.id===id);
  document.querySelectorAll(".theme-btn").forEach(x=>x.classList.toggle("active",x.dataset.id===id));
  if(compareChart){
    compareChart.data.datasets[0].backgroundColor=curTheme.primary;
    compareChart.data.datasets[1].backgroundColor=curTheme.secondary;
    compareChart.options.plugins.legend.labels.color=curTheme.tick;
    compareChart.options.scales.x.ticks.color=curTheme.tick;
    compareChart.update("none");
  }
  document.getElementById("lg24").style.background=curTheme.primary;
  document.getElementById("lg25").style.background=curTheme.secondary;
}
(function(){
  const box=document.getElementById("themeSwitch");
  THEMES.forEach((th,i)=>{
    const b=document.createElement("div");
    b.className="theme-btn"+(i===0?" active":"");
    b.dataset.id=th.id;
    b.innerHTML=`<span class="dot" style="background:${th.dot}"></span>${th.name}`;
    b.onclick=()=>applyTheme(th.id);
    box.appendChild(b);
  });
  applyTheme("theme-antgold");
})();

renderControls();
buildCompare();

</script>
</body>
</html>
